# Production deployment on localhost (lab 4, docs/deployment.md): the same image as on Render, with its own
# database and mail catcher, separate from the development stack in docker-compose.yml.
#   npm run prod:build && npm run prod:up   → http://localhost:8080, mail on http://localhost:8026
# The images are built by `docker build` (prod:build): Compose cannot build from a path with non-ASCII characters
# such as this repository's folder.
name: learnly-prod

x-app-env: &app-env
  DATABASE_URL: postgresql://learnly:learnly@postgres:5432/learnly
  APP_URL: http://localhost:8080
  # Local, non-secret value: the public deployments generate their own.
  JWT_SECRET: local-production-jwt-secret-0123456789abcdef
  # Plain HTTP on localhost; the public deployments run over HTTPS with COOKIE_SECURE=true.
  COOKIE_SECURE: 'false'
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  MAIL_FROM: Learnly <no-reply@learnly.local>
  RATE_LIMIT_GLOBAL_PER_MIN: '300'
  RATE_LIMIT_AUTH_PER_MIN: '10'
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: learnly
      POSTGRES_PASSWORD: learnly
      POSTGRES_DB: learnly
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learnly -d learnly']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.29.7
    ports:
      - '8026:8025'

  # Applies the migrations and loads the demo data into an empty database, then exits.
  setup:
    image: learnly:build
    pull_policy: never
    command: ['node', 'scripts/db-setup.mjs']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: learnly:local
    pull_policy: never
    ports:
      - '8080:3000'
    environment: *app-env
    volumes:
      - uploads:/app/apps/server/uploads
    depends_on:
      setup:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
